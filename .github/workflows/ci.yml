name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./webapp/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Build
      run: npm run build
      env:
        # Provide dummy env vars required for build if Next.js statically evaluates them
        DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy
        ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        JWT_ACCESS_SECRET: dummy
        GITHUB_CLIENT_ID: dummy
        GITHUB_CLIENT_SECRET: dummy

  build-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run Build
      run: npm run build
